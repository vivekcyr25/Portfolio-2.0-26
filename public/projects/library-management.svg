<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="lmsSpaceGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="indigoCore" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldCore" cx="25%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="neonCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="lmsGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="lmsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="lmsSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="675" fill="url(#lmsSpaceGlow)"/>
  <rect width="1200" height="675" fill="url(#indigoCore)"/>
  <rect width="1200" height="675" fill="url(#emeraldCore)"/>

  <!-- Starfield & Data Dust -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="95" r="1.5" />
    <circle cx="280" cy="160" r="1" />
    <circle cx="450" cy="70" r="2" opacity="0.9" filter="url(#lmsSubtle)" fill="#818cf8"/>
    <circle cx="720" cy="115" r="1.2" />
    <circle cx="940" cy="85" r="2" opacity="0.8" fill="#38bdf8"/>
    <circle cx="1110" cy="180" r="1" />
    <circle cx="160" cy="510" r="1.5" />
    <circle cx="880" cy="590" r="1.2" />
    <circle cx="1060" cy="490" r="2" opacity="0.8" fill="#a855f7"/>
  </g>

  <!-- Grid Coordinate Matrix -->
  <g stroke="#6366f1" stroke-width="0.7" opacity="0.2">
    <line x1="80" y1="0" x2="80" y2="675" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
    <line x1="1120" y1="0" x2="1120" y2="675" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Main System Console Frame -->
  <g transform="translate(150, 75)">
    <!-- Glass Panel Base -->
    <rect x="0" y="0" width="900" height="490" rx="16" fill="url(#lmsGlass)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="1" y="1" width="898" height="488" rx="15" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2"/>

    <!-- Window Top Header Bar -->
    <rect x="0" y="0" width="900" height="45" rx="16" fill="#080c1d" fill-opacity="0.8"/>
    <line x1="0" y1="45" x2="900" y2="45" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Window Controls -->
    <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="22" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="22" r="5" fill="#10b981" opacity="0.8"/>

    <!-- Console Header Info -->
    <text x="100" y="27" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="2">LMS_DATABASE_SYSTEM // PYTHON_CORE_V1.0</text>
    <text x="730" y="27" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8" letter-spacing="1">CATALOG: 14,280 VOLS</text>

    <!-- Left Sub-Panel: Database Records & Book Catalog Grid -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="520" height="390" rx="10" fill="#070a18" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- Search Bar -->
      <g transform="translate(15, 15)">
        <rect x="0" y="0" width="490" height="36" rx="6" fill="#0e142c" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="15" y="22" font-family="'Courier New', monospace" font-size="11" fill="#94a3b8">🔍 QUERY: search_book(isbn, title, author)...</text>
        <rect x="410" y="6" width="68" height="24" rx="4" fill="#6366f1" opacity="0.8"/>
        <text x="424" y="21" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ffffff">SEARCH</text>
      </g>

      <!-- Table Header -->
      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="490" height="28" rx="4" fill="#171e3d"/>
        <text x="15" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#818cf8">BOOK_ID</text>
        <text x="90" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#818cf8">TITLE &amp; CATEGORY</text>
        <text x="290" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#818cf8">STATUS</text>
        <text x="400" y="18" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#818cf8">ACTION</text>
      </g>

      <!-- Record Rows -->
      <!-- Row 1 -->
      <g transform="translate(15, 100)">
        <rect x="0" y="0" width="490" height="42" rx="4" fill="#0c1126" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">#BK-9041</text>
        <text x="90" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Quantum Computing &amp; Space</text>
        <text x="90" y="34" font-family="sans-serif" font-size="9" fill="#64748b">Section: Science / Theoretical</text>
        <rect x="290" y="12" width="75" height="18" rx="4" fill="#065f46" opacity="0.6"/>
        <text x="300" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#34d399">AVAILABLE</text>
        <text x="410" y="25" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">ISSUE »</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(15, 148)">
        <rect x="0" y="0" width="490" height="42" rx="4" fill="#0c1126" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">#BK-8422</text>
        <text x="90" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Neural Network Architectures</text>
        <text x="90" y="34" font-family="sans-serif" font-size="9" fill="#64748b">Section: Artificial Intelligence</text>
        <rect x="290" y="12" width="65" height="18" rx="4" fill="#854d0e" opacity="0.6"/>
        <text x="300" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#facc15">BORROWED</text>
        <text x="410" y="25" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">RETURN »</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(15, 196)">
        <rect x="0" y="0" width="490" height="42" rx="4" fill="#0c1126" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">#BK-7119</text>
        <text x="90" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Cosmic Propulsion Dynamics</text>
        <text x="90" y="34" font-family="sans-serif" font-size="9" fill="#64748b">Section: Aerospace Tech</text>
        <rect x="290" y="12" width="75" height="18" rx="4" fill="#065f46" opacity="0.6"/>
        <text x="300" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#34d399">AVAILABLE</text>
        <text x="410" y="25" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">ISSUE »</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(15, 244)">
        <rect x="0" y="0" width="490" height="42" rx="4" fill="#0c1126" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="25" font-family="'Courier New', monospace" font-size="11" fill="#38bdf8">#BK-6390</text>
        <text x="90" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Deep Space Data Protocols</text>
        <text x="90" y="34" font-family="sans-serif" font-size="9" fill="#64748b">Section: Cybernetics</text>
        <rect x="290" y="12" width="65" height="18" rx="4" fill="#854d0e" opacity="0.6"/>
        <text x="300" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#facc15">BORROWED</text>
        <text x="410" y="25" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">RETURN »</text>
      </g>

      <!-- Quick Action Toolbar -->
      <g transform="translate(15, 305)">
        <rect x="0" y="0" width="115" height="32" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
        <text x="14" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#c7d2fe">+ ADD BOOK</text>

        <rect x="125" y="0" width="115" height="32" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
        <text x="140" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#bae6fd">MEMBERS</text>

        <rect x="250" y="0" width="115" height="32" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1"/>
        <text x="265" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#e9d5ff">FINE STATS</text>

        <rect x="375" y="0" width="100" height="32" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1"/>
        <text x="390" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#bbf7d0">EXPORT</text>
      </g>
    </g>

    <!-- Right Sub-Panel: Analytics & Python Schema Breakdown -->
    <g transform="translate(560, 65)">
      <!-- System Stats Card -->
      <rect x="0" y="0" width="315" height="185" rx="10" fill="#070a18" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="18" y="28" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#38bdf8">INVENTORY ANALYTICS</text>
      
      <!-- Stats Metric 1 -->
      <g transform="translate(18, 45)">
        <text x="0" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8">Active Issued Books</text>
        <text x="210" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#818cf8">842</text>
        <rect x="0" y="22" width="280" height="5" rx="2.5" fill="#1e293b"/>
        <rect x="0" y="22" width="210" height="5" rx="2.5" fill="url(#neonIndigo)"/>
      </g>

      <!-- Stats Metric 2 -->
      <g transform="translate(18, 85)">
        <text x="0" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8">Catalog Available Rate</text>
        <text x="210" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#34d399">94.1%</text>
        <rect x="0" y="22" width="280" height="5" rx="2.5" fill="#1e293b"/>
        <rect x="0" y="22" width="260" height="5" rx="2.5" fill="url(#neonCyan2)"/>
      </g>

      <!-- Stats Metric 3 -->
      <g transform="translate(18, 125)">
        <text x="0" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8">Registered Patrons</text>
        <text x="210" y="14" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c084fc">3,120</text>
        <rect x="0" y="22" width="280" height="5" rx="2.5" fill="#1e293b"/>
        <rect x="0" y="22" width="190" height="5" rx="2.5" fill="#a855f7"/>
      </g>

      <!-- Python OOP Schema Card -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="315" height="190" rx="10" fill="#070a18" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
        <text x="18" y="28" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#c084fc">PYTHON OOP ARCHITECTURE</text>
        
        <g transform="translate(18, 45)">
          <text x="0" y="12" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">class Library:</text>
          <text x="15" y="28" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">def issue_book(self, id):</text>
          <text x="30" y="44" font-family="'Courier New', monospace" font-size="10" fill="#34d399">self.db.update(status="LENT")</text>
          <text x="15" y="62" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">def return_book(self, id):</text>
          <text x="30" y="78" font-family="'Courier New', monospace" font-size="10" fill="#38bdf8">self.calc_fine(days)</text>
          <text x="0" y="105" font-family="'Courier New', monospace" font-size="9" fill="#818cf8">DATABASE: SQLite3 / JSON Store</text>
          <text x="0" y="122" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">GUI: Tkinter / CustomTkinter</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Glowing Corner Accents -->
  <g stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 130,95 L 130,55 L 170,55" />
    <path d="M 1070,95 L 1070,55 L 1030,55" />
    <path d="M 130,545 L 130,585 L 170,585" />
    <path d="M 1070,545 L 1070,585 L 1030,585" />
  </g>
</svg>
